name: watch

# Every 10 minutes (GitHub may delay scheduled runs by a few minutes under load).
on:
  schedule:
    - cron: "3-59/10 * * * *"
  workflow_dispatch:

concurrency:
  group: watch
  cancel-in-progress: false

permissions:
  contents: write
  actions: write      # lets a run start the next one, so the bot stays online

jobs:
  check:
    # Set the repository variable RUNNER=self-hosted to run on your own machine (Romanian home IP).
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      # Optional: repository variable BOT_BROWSER=1 (or a list like pcgarage,flanco) enables a headless
      # Chromium fallback for sites that answer with a JS challenge. Adds ~1 min per run.
      - name: Install browser (optional)
        if: ${{ vars.BOT_BROWSER != '' }}
        run: pip install playwright && python -m playwright install --with-deps chromium

      # Fails (and so skips the check and the save) if the saved state exists but cannot be read,
      # e.g. during a GitHub hiccup: an empty state must never be pushed over the real one.
      - name: Load state
        id: load
        run: |
          bash scripts/load_state.sh state.json
          python -m bot.statesync load state-home state-home.json || true

      - name: Check prices
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BOT_AI_MODEL: ${{ vars.BOT_AI_MODEL }}
          BOT_AI_CLASSIFY_MODEL: ${{ vars.BOT_AI_CLASSIFY_MODEL }}
          BOT_PROXY: ${{ secrets.BOT_PROXY }}
          BOT_PROXY_STORES: ${{ vars.BOT_PROXY_STORES }}
          BOT_BROWSER: ${{ vars.BOT_BROWSER }}
          BOT_HOME_ENABLED: ${{ vars.HOME_RUNNER }}
          BOT_LISTEN_MINUTES: "9"
          BOT_APP_URL: ${{ vars.BOT_APP_URL }}
        run: python -m bot run --state state.json

      - name: Save state
        if: ${{ always() && steps.load.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/save_state.sh state.json

      # Keep the bot online: every run starts the next one (GitHub's own schedule is often hours late).
      # Set the repository variable BOT_CONTINUOUS=false to stop the chain (the cron above still runs).
      - name: Start the next run
        if: always() && vars.BOT_CONTINUOUS != 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run watch.yml --repo "$GITHUB_REPOSITORY" --ref "${GITHUB_REF_NAME:-main}" || true
