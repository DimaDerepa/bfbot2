name: watch-home

# Runs on YOUR computer (GitHub self-hosted runner) with a Romanian home IP, for the shops that block
# GitHub's cloud (eMAG, PC Garage, evoMAG, CEL, Flanco, compari.ro, ...). Enabled by the repository variable
# HOME_RUNNER = true. Each run starts the next one ~10 minutes later; if the computer is off, the chain
# resumes on the next schedule tick after it is back.
#
# No PowerShell is used (Windows blocks .ps1 scripts by default): every step runs through Python.
# Windows needs Python installed for all users (scripts/setup-home-windows.ps1 does it);
# macOS / Linux get Python from actions/setup-python.
on:
  schedule:
    - cron: "6-59/10 * * * *"
  workflow_dispatch:

concurrency:
  group: watch-home
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  home:
    if: ${{ vars.HOME_RUNNER == 'true' }}
    runs-on: self-hosted
    timeout-minutes: 25
    steps:
      - name: Check Python (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        # 1) python on PATH  2) a machine-wide install (works before the reboot)  3) otherwise a private copy of
        # Python for the runner in its tool cache: no admin rights, nothing installed system-wide
        run: |
          @echo off
          where python >nul 2>nul
          if not errorlevel 1 (
            python --version
            exit /b 0
          )
          set "PYDIR="
          for /d %%D in ("%ProgramFiles%\Python3*") do if exist "%%~D\python.exe" set "PYDIR=%%~D"
          if defined PYDIR goto found
          set "PYDIR=%RUNNER_TOOL_CACHE%\python-embed-3.12"
          if exist "%PYDIR%\python.exe" goto pth
          echo Downloading Python 3.12 for the runner into %PYDIR%
          if not exist "%PYDIR%" mkdir "%PYDIR%"
          curl.exe -fsSL -o "%RUNNER_TEMP%\py-embed.zip" https://www.python.org/ftp/python/3.12.8/python-3.12.8-embed-amd64.zip || exit /b 1
          tar -xf "%RUNNER_TEMP%\py-embed.zip" -C "%PYDIR%" || exit /b 1
          :pth
          > "%PYDIR%\python312._pth" echo python312.zip
          >> "%PYDIR%\python312._pth" echo .
          >> "%PYDIR%\python312._pth" echo Lib\site-packages
          >> "%PYDIR%\python312._pth" echo %GITHUB_WORKSPACE%
          >> "%PYDIR%\python312._pth" echo import site
          if exist "%PYDIR%\Scripts\pip.exe" goto found
          curl.exe -fsSL -o "%PYDIR%\get-pip.py" https://bootstrap.pypa.io/get-pip.py || exit /b 1
          "%PYDIR%\python.exe" "%PYDIR%\get-pip.py" --no-warn-script-location -q || exit /b 1
          :found
          echo Using %PYDIR%\python.exe
          >>"%GITHUB_PATH%" echo %PYDIR%
          >>"%GITHUB_PATH%" echo %PYDIR%\Scripts
          "%PYDIR%\python.exe" --version

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: runner.os != 'Windows'
        with:
          python-version: "3.12"

      - name: Install
        shell: python {0}
        run: |
          import subprocess, sys
          sys.exit(subprocess.call([sys.executable, "-m", "pip", "install", "--disable-pip-version-check", "-q", "-r", "requirements.txt"]))

      - name: Load state
        shell: python {0}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          import subprocess, sys
          sys.exit(subprocess.call([sys.executable, "-m", "bot.statesync", "load", "state", "state.json"])
                   or subprocess.call([sys.executable, "-m", "bot.statesync", "load", "state-home", "state-home.json"]))

      - name: Check prices (home shops)
        shell: python {0}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BOT_AI_MODEL: ${{ vars.BOT_AI_MODEL }}
          BOT_AI_CLASSIFY_MODEL: ${{ vars.BOT_AI_CLASSIFY_MODEL }}
          BOT_MODE: home
        run: |
          import subprocess, sys
          sys.exit(subprocess.call([sys.executable, "-m", "bot", "run", "--state", "state.json"]))

      - name: Save state
        if: always()
        shell: python {0}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          import os, subprocess, sys
          if not os.path.exists("state-home.json"):
              sys.exit(0)
          sys.exit(subprocess.call([sys.executable, "-m", "bot.statesync", "save", "state-home", "state-home.json"]))

      # keep checking every ~10 minutes while the computer is on (GitHub's schedule is often hours late)
      - name: Start the next run
        if: always() && vars.BOT_CONTINUOUS != 'false'
        shell: python {0}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          import subprocess, sys
          subprocess.call([sys.executable, "-m", "bot.statesync", "next", "watch-home.yml", "480"])
